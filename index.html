<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikon.uz — Quality Technology</title>
    <link rel="icon" type="image/svg+xml" href="/bikon.svg" />
    <link rel="apple-touch-icon" href="/bikon.svg" />
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load fonts as stylesheet (faster than @import in CSS) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=Caveat:wght@400;700&display=swap" />
    <!-- Preload critical above-the-fold image -->
    <link rel="preload" as="image" href="/main.png" />
    <script>
      // Fix for "Cannot set property fetch of #<Window> which has only a getter"
      // This can happen if a polyfill or library tries to overwrite window.fetch in a restricted environment.
      try {
        if (typeof window.fetch === 'function') {
          const originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: () => originalFetch,
            set: () => { console.warn('Attempted to overwrite window.fetch, but it is read-only.'); },
            configurable: true
          });
        }
      } catch (e) {
        console.warn('Could not redefine window.fetch, but continuing anyway.');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
